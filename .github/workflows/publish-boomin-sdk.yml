name: Publish @boomin/sdk

# The flagship SDK. Publish this BEFORE @boomin/cli: the CLI depends on
# @boomin/sdk, so a CLI publish resolves against whatever is on the registry.
#
# dist-tag is an input because it is a launch decision, not a constant:
# `npm i @boomin/sdk` resolves the `latest` tag, so a beta-only publish makes
# the documented install command fail. See PUBLISHING.md.

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (latest makes `npm i @boomin/sdk` work; beta does not)"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - beta
  push:
    tags:
      - "@boomin/sdk@*"
      - "boomin-sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack smoke
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --tag "${{ inputs.dist_tag || 'latest' }}"
